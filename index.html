<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Sign-Up Form</title>
</head>
<body>
    <dev class="container">
        <div class="side">
            <div class="header">
                <img src="img/odin-lined.png" alt="Logo" id="log-img">
                <h1 id="logo">Logo</h1>
            </div>     
        </div>
        <div class="main">
            <p class="par" id="par-1">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
            <p class="par" id="par-2"> Sign up <em>now</em> to get started.</p>
            <p class="par" id="par-3">You know you want to.</p>
            <form action="" method="post">
                <section>
                    <h2>Let's do this!</h2>
                    <div class="info-sec">
                        <div class="col-1">
                         <div class="info">
                            <label for="first_name">First Name</label> 
                            <input type="text" id="first_name" name="first_name">
                        </div>
                        <div class="info">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="info">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" minlength="8">
                        </div>
                        </div>
                        <div class="col-2">
                        <div class="info">
                            <label for="last_name">Last Name</label>
                            <input type="text" id="last_name" name="last_name">
                        </div>
                        <div class="info">
                            <label for="tel">Phone number(optional)</label>
                            <input type="tel" id="tel" name="tel">
                        </div>
                        <div class="info">
                            <label for="password-confirm">Confirm password</label>
                            <input type="password" id="password-confirm" name="password-confirm" minlength="8">
                        </div>
                        </div>
                    </div>
                </section>
                <button type="submit">Create Account</button>
            </form>
            <span>Already have an account?</span><a href="">Log in</a>
        </div>
    </dev>
</body>
</html>
