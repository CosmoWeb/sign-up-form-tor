<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Sign-Up Form</title>
</head>
<body>
    <dev class="container">
        <div class="side">
            <div class="header">
                <img src="img/odin-lined.png" alt="Logo" id="log-img">
                <h1 id="logo">Logo</h1>
            </div>     
        </div>
        <div class="main">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
            <p>You know you want to.</p>
            <form action="" method="post">
                <section>
                    <h2>Let's do this!</h2>
                    <div class="info">
                        <label for="first_name">First Name</label> 
                        <input type="text" id="first_name" name="first_name">
                    </div>
                    <div class="info">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name"></div>
                    <div class="info">
                        <label for="email"></label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="info">
                        <label for="tel"></label>
                        <input type="tel" id="tel" name="tel">
                    </div>
                    <div class="info">
                        <label for="password"></label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="info">
                        <label for="password-confirm"></label>
                        <input type="password" id="password-confirm" name="password-confirm">
                    </div>
                </section>
                <button type="submit">Create Account</button>
            </form>
            <span>Already have an account?</span><a href="">Log in</a>
        </div>
    </dev>
</body>
</html>
